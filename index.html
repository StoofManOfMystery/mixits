        /* Gradient background effect */
        .music-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .card-gradient {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
        }

        /* Rating stars/slider styling */
        .rating-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);

            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .rating-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        /* Prevent zoom on input focus for iOS */
        input, textarea, select {
            font-size: 16px !important;

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {

                            timestamp: Date.now() - Math.floor(Math.random() * 7 * 24 * 60 * 60 * 1000)
                        };
                        album.songs.forEach(song => {
                            if (Math.random() > 0.2) {
                                ratings[user.id][album.id].songs[song.id] = {
                                    rating: Math.floor(Math.random() * 5) + 5,
                                    comment: Math.random() > 0.7 ? "Love this track!" : null
                                };
                            }
                        });
                    }
                });
            });
            return ratings;
        };

        // Main App Component
        function MusicRatingApp() {
            // Auth state
            const [currentUser, setCurrentUser] = useState(null);
            const [authMode, setAuthMode] = useState("login"); // login or register
            const [authUsername, setAuthUsername] = useState("");
            const [authPassword, setAuthPassword] = useState("");
            const [authError, setAuthError] = useState("");

            // App state
            const [currentPage, setCurrentPage] = useState("home"); // home, album, profile, friends, friendProfile
            const [selectedAlbum, setSelectedAlbum] = useState(null);
            const [selectedFriend, setSelectedFriend] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [friendSearchQuery, setFriendSearchQuery] = useState("");

            // Data state
            const [users, setUsers] = useState({});
            const [ratings, setRatings] = useState({});
            const [friends, setFriends] = useState({});
            const [demoRatings, setDemoRatings] = useState({});

            // Load data from localStorage
            useEffect(() => {
                const savedUsers = localStorage.getItem('ratemusic_users');
                const savedRatings = localStorage.getItem('ratemusic_ratings');
                const savedFriends = localStorage.getItem('ratemusic_friends');
                const savedCurrentUser = localStorage.getItem('ratemusic_currentUser');
                const savedDemoRatings = localStorage.getItem('ratemusic_demoRatings');

                if (savedUsers) setUsers(JSON.parse(savedUsers));
                if (savedRatings) setRatings(JSON.parse(savedRatings));
                if (savedFriends) setFriends(JSON.parse(savedFriends));
                if (savedCurrentUser) setCurrentUser(JSON.parse(savedCurrentUser));
                if (savedDemoRatings) {
                    setDemoRatings(JSON.parse(savedDemoRatings));
                } else {
                    const newDemoRatings = generateDemoRatings();
                    setDemoRatings(newDemoRatings);
                    localStorage.setItem('ratemusic_demoRatings', JSON.stringify(newDemoRatings));
                }
            }, []);

            // Save data to localStorage
            useEffect(() => {
                localStorage.setItem('ratemusic_users', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('ratemusic_ratings', JSON.stringify(ratings));
            }, [ratings]);

            useEffect(() => {
                localStorage.setItem('ratemusic_friends', JSON.stringify(friends));
            }, [friends]);

            useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('ratemusic_currentUser', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('ratemusic_currentUser');
                }
            }, [currentUser]);

            // Auth functions
            const handleRegister = () => {
                if (authUsername.length < 3) {
                    setAuthError("Username must be at least 3 characters");
                    return;
                }
                if (authPassword.length < 4) {
                    setAuthError("Password must be at least 4 characters");
                    return;
                }
                if (users[authUsername.toLowerCase()]) {
                    setAuthError("Username already exists");
                    return;
                }

                const newUser = {
                    id: Date.now().toString(),
                    username: authUsername.toLowerCase(),
                    displayName: authUsername,
                    createdAt: Date.now()
                };

                setUsers({ ...users, [authUsername.toLowerCase()]: { ...newUser, password: authPassword } });
                setCurrentUser(newUser);
                setFriends({ ...friends, [newUser.id]: [] });
                setRatings({ ...ratings, [newUser.id]: {} });
                setAuthUsername("");
                setAuthPassword("");
                setAuthError("");
            };

            const handleLogin = () => {
                const user = users[authUsername.toLowerCase()];
                if (!user || user.password !== authPassword) {
                    setAuthError("Invalid username or password");
                    return;
                }

                const { password, ...userWithoutPassword } = user;
                setCurrentUser(userWithoutPassword);
                setAuthUsername("");
                setAuthPassword("");
                setAuthError("");
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setCurrentPage("home");
            };

            // Rating functions
            const rateSong = (albumId, songId, rating) => {
                if (!currentUser) return;

                setRatings(prev => ({
                    ...prev,
                    [currentUser.id]: {
                        ...prev[currentUser.id],
                        [albumId]: {
                            ...prev[currentUser.id]?.[albumId],
                            songs: {
                                ...prev[currentUser.id]?.[albumId]?.songs,
                                [songId]: {
                                    ...prev[currentUser.id]?.[albumId]?.songs?.[songId],
                                    rating,
                                    timestamp: Date.now()
                                }
                            },
                            timestamp: Date.now()
                        }
                    }
                }));
            };

            const addSongComment = (albumId, songId, comment) => {
                if (!currentUser) return;

                setRatings(prev => ({
                    ...prev,
                    [currentUser.id]: {
                        ...prev[currentUser.id],
                        [albumId]: {
                            ...prev[currentUser.id]?.[albumId],
                            songs: {
                                ...prev[currentUser.id]?.[albumId]?.songs,
                                [songId]: {
                                    ...prev[currentUser.id]?.[albumId]?.songs?.[songId],
                                    comment
                                }
                            }
                        }
                    }
                }));
            };

            const addAlbumComment = (albumId, comment) => {
                if (!currentUser) return;

                setRatings(prev => ({
                    ...prev,
                    [currentUser.id]: {
                        ...prev[currentUser.id],
                        [albumId]: {
                            ...prev[currentUser.id]?.[albumId],
                            albumComment: comment,
                            timestamp: Date.now()
                        }
                    }
                }));
            };

            // Calculate album rating from song ratings
            const getAlbumRating = (userId, albumId) => {
                const userRatings = ratings[userId]?.[albumId]?.songs || demoRatings[userId]?.[albumId]?.songs || {};
                const songRatings = Object.values(userRatings).filter(r => r.rating !== undefined).map(r => r.rating);
                if (songRatings.length === 0) return null;
                const avg = songRatings.reduce((a, b) => a + b, 0) / songRatings.length;
                return Math.round(avg * 10) / 10;
            };

            // Friend functions
            const addFriend = (friendId) => {
                if (!currentUser) return;
                const currentFriends = friends[currentUser.id] || [];
                if (!currentFriends.includes(friendId)) {
                    setFriends({
                        ...friends,
                        [currentUser.id]: [...currentFriends, friendId]
                    });
                }
            };

            const removeFriend = (friendId) => {
                if (!currentUser) return;
                setFriends({
                    ...friends,
                    [currentUser.id]: (friends[currentUser.id] || []).filter(id => id !== friendId)
                });
            };

            const isFriend = (userId) => {
                if (!currentUser) return false;
                return (friends[currentUser.id] || []).includes(userId);
            };

            // Get all available users (real + demo)
            const getAllUsers = () => {
                const realUsers = Object.values(users).map(u => ({
                    id: u.id,
                    username: u.username,
                    displayName: u.displayName
                }));
                return [...realUsers, ...DEMO_USERS].filter(u => u.id !== currentUser?.id);
            };

            // Get friend activity
            const getFriendActivity = () => {
                if (!currentUser) return [];
                const friendIds = friends[currentUser.id] || [];
                const activity = [];

                friendIds.forEach(friendId => {
                    const friendRatings = { ...ratings[friendId], ...demoRatings[friendId] };
                    const friend = getAllUsers().find(u => u.id === friendId);
                    if (!friend) return;

                    Object.entries(friendRatings).forEach(([albumId, albumData]) => {
                        const album = ALBUM_DATABASE.find(a => a.id === parseInt(albumId));
                        if (!album) return;

                        const avgRating = getAlbumRating(friendId, parseInt(albumId));
                        if (avgRating !== null) {
                            activity.push({
                                friend,
                                album,
                                rating: avgRating,
                                comment: albumData.albumComment,
                                timestamp: albumData.timestamp || Date.now()
                            });
                        }
                    });
                });

                return activity.sort((a, b) => b.timestamp - a.timestamp);
            };

            // Filter albums by search
            const filteredAlbums = ALBUM_DATABASE.filter(album =>
                album.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                album.artist.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // Render rating display
            const RatingDisplay = ({ rating, size = "normal" }) => {
                const textSize = size === "large" ? "text-3xl" : "text-xl";
                const color = rating >= 8 ? "text-green-400" : rating >= 6 ? "text-yellow-400" : rating >= 4 ? "text-orange-400" : "text-red-400";
                return (
                    <span className={`${textSize} font-bold ${color}`}>
                        {rating.toFixed(1)}
                    </span>
                );
            };

            // Auth Screen
            if (!currentUser) {
                return (
                    <div className="min-h-screen music-bg text-white flex items-center justify-center p-4">
                        <div className="card-gradient rounded-2xl p-8 w-full max-w-md border-2 border-pink-500/30">
                            <div className="flex items-center justify-center gap-3 mb-8">
                                <Music />
                                <h1 className="text-3xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                                    RateMyMusic
                                </h1>
                            </div>

                            <div className="flex mb-6">
                                <button
                                    onClick={() => { setAuthMode("login"); setAuthError(""); }}
                                    className={`flex-1 py-3 text-center font-semibold transition-colors ${
                                        authMode === "login"
                                            ? "bg-pink-500/20 border-b-2 border-pink-500"
                                            : "text-gray-400"
                                    }`}
                                >
                                    Login
                                </button>
                                <button
                                    onClick={() => { setAuthMode("register"); setAuthError(""); }}
                                    className={`flex-1 py-3 text-center font-semibold transition-colors ${
                                        authMode === "register"
                                            ? "bg-pink-500/20 border-b-2 border-pink-500"
                                            : "text-gray-400"
                                    }`}
                                >
                                    Register
                                </button>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm text-gray-400 mb-2">Username</label>
                                    <input
                                        type="text"
                                        value={authUsername}
                                        onChange={(e) => setAuthUsername(e.target.value)}
                                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white"
                                        placeholder="Enter username"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-400 mb-2">Password</label>
                                    <input
                                        type="password"
                                        value={authPassword}
                                        onChange={(e) => setAuthPassword(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && (authMode === "login" ? handleLogin() : handleRegister())}
                                        className="w-full px-4 py-3 rounded-xl bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white"
                                        placeholder="Enter password"
                                    />
                                </div>

                                {authError && (
                                    <p className="text-red-400 text-sm">{authError}</p>
                                )}

                                <button
                                    onClick={authMode === "login" ? handleLogin : handleRegister}
                                    className="w-full py-3 rounded-xl font-semibold text-white transition-all"
                                    style={{ background: "linear-gradient(135deg, #e94560 0%, #0f3460 100%)" }}
                                >
                                    {authMode === "login" ? "Login" : "Create Account"}
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // Album Detail Page
            if (currentPage === "album" && selectedAlbum) {
                const userAlbumRatings = ratings[currentUser.id]?.[selectedAlbum.id]?.songs || {};
                const albumRating = getAlbumRating(currentUser.id, selectedAlbum.id);
                const albumComment = ratings[currentUser.id]?.[selectedAlbum.id]?.albumComment || "";

                return (
                    <div className="min-h-screen music-bg text-white pb-24">
                        {/* Header */}
                        <div className="sticky top-0 z-20 p-4" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)" }}>
                            <button
                                onClick={() => { setCurrentPage("home"); setSelectedAlbum(null); }}
                                className="flex items-center gap-2 text-pink-400 mb-4"
                            >
                                <ChevronLeft /> Back
                            </button>
                        </div>

                        <div className="p-4 max-w-2xl mx-auto">
                            {/* Album Info */}
                            <div className="flex gap-4 mb-6">
                                <img
                                    src={selectedAlbum.cover}
                                    alt={selectedAlbum.name}
                                    className="w-32 h-32 rounded-xl object-cover shadow-lg"
                                    onError={(e) => { e.target.src = "https://via.placeholder.com/128?text=Album"; }}
                                />
                                <div className="flex-1">
                                    <h1 className="text-2xl font-bold mb-1">{selectedAlbum.name}</h1>
                                    <p className="text-pink-400 mb-1">{selectedAlbum.artist}</p>
                                    <p className="text-gray-400 text-sm">{selectedAlbum.year} • {selectedAlbum.genre}</p>
                                    {albumRating !== null && (
                                        <div className="mt-2">
                                            <span className="text-gray-400 text-sm">Your Rating: </span>
                                            <RatingDisplay rating={albumRating} size="large" />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Album Comment */}
                            <div className="card-gradient rounded-xl p-4 mb-6 border border-pink-500/20">
                                <h3 className="font-semibold mb-2 flex items-center gap-2">
                                    <MessageCircle /> Album Comment
                                </h3>
                                <textarea
                                    value={albumComment}
                                    onChange={(e) => addAlbumComment(selectedAlbum.id, e.target.value)}
                                    placeholder="Share your thoughts on this album..."
                                    className="w-full px-4 py-3 rounded-xl bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white resize-none"
                                    rows="3"
                                />
                            </div>

                            {/* Songs List */}
                            <h2 className="text-xl font-semibold mb-4">Tracks</h2>
                            <div className="space-y-3">
                                {selectedAlbum.songs.map((song, idx) => {
                                    const songData = userAlbumRatings[song.id] || {};
                                    const [showComment, setShowComment] = React.useState(false);

                                    return (
                                        <div
                                            key={song.id}
                                            className="card-gradient rounded-xl p-4 border border-pink-500/20"
                                        >
                                            <div className="flex items-start justify-between mb-3">
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-gray-500 text-sm w-6">{idx + 1}</span>
                                                        <div>
                                                            <p className="font-medium">{song.name}</p>
                                                            <p className="text-gray-400 text-sm">{song.duration}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                                {songData.rating !== undefined && (
                                                    <RatingDisplay rating={songData.rating} />
                                                )}
                                            </div>

                                            {/* Rating Slider */}
                                            <div className="flex items-center gap-4">
                                                <span className="text-sm text-gray-400 w-8">0</span>
                                                <input
                                                    type="range"
                                                    min="0"
                                                    max="10"
                                                    step="0.5"
                                                    value={songData.rating || 0}
                                                    onChange={(e) => rateSong(selectedAlbum.id, song.id, parseFloat(e.target.value))}
                                                    className="flex-1 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer rating-slider"
                                                />
                                                <span className="text-sm text-gray-400 w-8">10</span>
                                                <button
                                                    onClick={() => setShowComment(!showComment)}
                                                    className={`p-2 rounded-lg transition-colors ${showComment ? "bg-pink-500/30" : "bg-white/5"}`}
                                                >
                                                    <MessageCircle />
                                                </button>
                                            </div>

                                            {/* Comment Field */}
                                            {showComment && (
                                                <div className="mt-3">
                                                    <input
                                                        type="text"
                                                        value={songData.comment || ""}
                                                        onChange={(e) => addSongComment(selectedAlbum.id, song.id, e.target.value)}
                                                        placeholder="Add a comment for this song..."
                                                        className="w-full px-4 py-2 rounded-lg bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white text-sm"
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Bottom Nav */}
                        <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    </div>
                );
            }

            // Friend Profile Page
            if (currentPage === "friendProfile" && selectedFriend) {
                const friendRatings = { ...ratings[selectedFriend.id], ...demoRatings[selectedFriend.id] };

                return (
                    <div className="min-h-screen music-bg text-white pb-24">
                        {/* Header */}
                        <div className="sticky top-0 z-20 p-4" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)" }}>
                            <button
                                onClick={() => { setCurrentPage("friends"); setSelectedFriend(null); }}
                                className="flex items-center gap-2 text-pink-400 mb-4"
                            >
                                <ChevronLeft /> Back
                            </button>
                        </div>

                        <div className="p-4 max-w-2xl mx-auto">
                            {/* Friend Info */}
                            <div className="flex items-center gap-4 mb-6">
                                <div className="w-20 h-20 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-3xl font-bold">
                                    {selectedFriend.displayName[0].toUpperCase()}
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold">{selectedFriend.displayName}</h1>
                                    <p className="text-gray-400">@{selectedFriend.username}</p>
                                </div>
                            </div>

                            <h2 className="text-xl font-semibold mb-4">{selectedFriend.displayName}'s Ratings</h2>

                            {/* Friend's Album Ratings */}
                            <div className="space-y-4">
                                {Object.entries(friendRatings).length === 0 ? (
                                    <p className="text-gray-400 text-center py-8">No ratings yet</p>
                                ) : (
                                    Object.entries(friendRatings).map(([albumId, albumData]) => {
                                        const album = ALBUM_DATABASE.find(a => a.id === parseInt(albumId));
                                        if (!album) return null;
                                        const avgRating = getAlbumRating(selectedFriend.id, parseInt(albumId));
                                        if (avgRating === null) return null;

                                        return (
                                            <div key={albumId} className="card-gradient rounded-xl p-4 border border-pink-500/20">
                                                <div className="flex gap-4">
                                                    <img
                                                        src={album.cover}
                                                        alt={album.name}
                                                        className="w-16 h-16 rounded-lg object-cover"
                                                        onError={(e) => { e.target.src = "https://via.placeholder.com/64?text=Album"; }}
                                                    />
                                                    <div className="flex-1">
                                                        <h3 className="font-semibold">{album.name}</h3>
                                                        <p className="text-pink-400 text-sm">{album.artist}</p>
                                                        <div className="flex items-center gap-2 mt-1">
                                                            <RatingDisplay rating={avgRating} />
                                                            <span className="text-gray-400 text-sm">
                                                                ({Object.keys(albumData.songs || {}).length} songs rated)
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                                {albumData.albumComment && (
                                                    <p className="mt-3 text-gray-300 text-sm bg-white/5 rounded-lg p-3">
                                                        "{albumData.albumComment}"
                                                    </p>
                                                )}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                        {/* Bottom Nav */}
                        <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    </div>
                );
            }

            // Bottom Navigation Component
            const BottomNav = ({ currentPage, setCurrentPage }) => (
                <div className="fixed bottom-0 left-0 right-0 z-30" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)", borderTop: "1px solid rgba(233, 69, 96, 0.2)" }}>
                    <div className="flex justify-around py-3 max-w-2xl mx-auto">
                        <button
                            onClick={() => { setCurrentPage("home"); setSelectedAlbum(null); }}
                            className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-colors ${
                                currentPage === "home" ? "text-pink-500" : "text-gray-400"
                            }`}
                        >
                            <Home />
                            <span className="text-xs">Home</span>
                        </button>
                        <button
                            onClick={() => setCurrentPage("friends")}
                            className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-colors ${
                                currentPage === "friends" || currentPage === "friendProfile" ? "text-pink-500" : "text-gray-400"
                            }`}
                        >
                            <Users />
                            <span className="text-xs">Friends</span>
                        </button>
                        <button
                            onClick={() => setCurrentPage("profile")}
                            className={`flex flex-col items-center gap-1 px-4 py-2 rounded-xl transition-colors ${
                                currentPage === "profile" ? "text-pink-500" : "text-gray-400"
                            }`}
                        >
                            <User />
                            <span className="text-xs">Profile</span>
                        </button>
                    </div>
                </div>
            );

            // Friends Page
            if (currentPage === "friends") {
                const allUsers = getAllUsers();
                const userFriends = friends[currentUser.id] || [];
                const friendActivity = getFriendActivity();

                const filteredUsers = allUsers.filter(u =>
                    u.username.toLowerCase().includes(friendSearchQuery.toLowerCase()) ||
                    u.displayName.toLowerCase().includes(friendSearchQuery.toLowerCase())
                );

                return (
                    <div className="min-h-screen music-bg text-white pb-24">
                        {/* Header */}
                        <div className="p-4 sticky top-0 z-20" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)" }}>
                            <h1 className="text-2xl font-bold mb-4">Friends</h1>

                            {/* Search Users */}
                            <div className="relative">
                                <div className="absolute left-4 top-1/2 transform -translate-y-1/2 text-pink-500">
                                    <Search />
                                </div>
                                <input
                                    type="text"
                                    value={friendSearchQuery}
                                    onChange={(e) => setFriendSearchQuery(e.target.value)}
                                    placeholder="Search users..."
                                    className="w-full pl-12 pr-4 py-3 rounded-xl bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white"
                                />
                            </div>
                        </div>

                        <div className="p-4 max-w-2xl mx-auto">
                            {/* User Search Results */}
                            {friendSearchQuery && (
                                <div className="mb-6">
                                    <h2 className="text-lg font-semibold mb-3">Search Results</h2>
                                    <div className="space-y-2">
                                        {filteredUsers.length === 0 ? (
                                            <p className="text-gray-400">No users found</p>
                                        ) : (
                                            filteredUsers.map(user => (
                                                <div
                                                    key={user.id}
                                                    className="card-gradient rounded-xl p-4 flex items-center justify-between border border-pink-500/20"
                                                >
                                                    <div
                                                        className="flex items-center gap-3 cursor-pointer"
                                                        onClick={() => {
                                                            setSelectedFriend(user);
                                                            setCurrentPage("friendProfile");
                                                        }}
                                                    >
                                                        <div className="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center font-bold">
                                                            {user.displayName[0].toUpperCase()}
                                                        </div>
                                                        <div>
                                                            <p className="font-medium">{user.displayName}</p>
                                                            <p className="text-gray-400 text-sm">@{user.username}</p>
                                                        </div>
                                                    </div>
                                                    {isFriend(user.id) ? (
                                                        <button
                                                            onClick={() => removeFriend(user.id)}
                                                            className="p-2 rounded-lg bg-red-500/20 text-red-400"
                                                        >
                                                            <UserMinus />
                                                        </button>
                                                    ) : (
                                                        <button
                                                            onClick={() => addFriend(user.id)}
                                                            className="p-2 rounded-lg bg-pink-500/20 text-pink-400"
                                                        >
                                                            <UserPlus />
                                                        </button>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* My Friends */}
                            <div className="mb-6">
                                <h2 className="text-lg font-semibold mb-3">My Friends ({userFriends.length})</h2>
                                {userFriends.length === 0 ? (
                                    <p className="text-gray-400 text-center py-4">Search for users to add friends!</p>
                                ) : (
                                    <div className="space-y-2">
                                        {userFriends.map(friendId => {
                                            const friend = allUsers.find(u => u.id === friendId);
                                            if (!friend) return null;
                                            return (
                                                <div
                                                    key={friendId}
                                                    className="card-gradient rounded-xl p-4 flex items-center justify-between border border-pink-500/20"
                                                >
                                                    <div
                                                        className="flex items-center gap-3 cursor-pointer"
                                                        onClick={() => {
                                                            setSelectedFriend(friend);
                                                            setCurrentPage("friendProfile");
                                                        }}
                                                    >
                                                        <div className="w-10 h-10 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center font-bold">
                                                            {friend.displayName[0].toUpperCase()}
                                                        </div>
                                                        <div>
                                                            <p className="font-medium">{friend.displayName}</p>
                                                            <p className="text-gray-400 text-sm">@{friend.username}</p>
                                                        </div>
                                                    </div>
                                                    <button
                                                        onClick={() => removeFriend(friendId)}
                                                        className="p-2 rounded-lg bg-red-500/20 text-red-400"
                                                    >
                                                        <UserMinus />
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>

                            {/* Friend Activity */}
                            {friendActivity.length > 0 && (
                                <div>
                                    <h2 className="text-lg font-semibold mb-3">Friend Activity</h2>
                                    <div className="space-y-3">
                                        {friendActivity.slice(0, 10).map((activity, idx) => (
                                            <div
                                                key={idx}
                                                className="card-gradient rounded-xl p-4 border border-pink-500/20"
                                            >
                                                <div className="flex items-center gap-2 mb-2">
                                                    <div className="w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-sm font-bold">
                                                        {activity.friend.displayName[0].toUpperCase()}
                                                    </div>
                                                    <span className="font-medium">{activity.friend.displayName}</span>
                                                    <span className="text-gray-400">rated</span>
                                                </div>
                                                <div className="flex gap-3">
                                                    <img
                                                        src={activity.album.cover}
                                                        alt={activity.album.name}
                                                        className="w-12 h-12 rounded-lg object-cover"
                                                        onError={(e) => { e.target.src = "https://via.placeholder.com/48?text=Album"; }}
                                                    />
                                                    <div className="flex-1">
                                                        <p className="font-medium text-sm">{activity.album.name}</p>
                                                        <p className="text-pink-400 text-xs">{activity.album.artist}</p>
                                                    </div>
                                                    <RatingDisplay rating={activity.rating} />
                                                </div>
                                                {activity.comment && (
                                                    <p className="mt-2 text-gray-300 text-sm">"{activity.comment}"</p>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Bottom Nav */}
                        <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    </div>
                );
            }

            // Profile Page
            if (currentPage === "profile") {
                const userRatings = ratings[currentUser.id] || {};
                const ratedAlbums = Object.entries(userRatings)
                    .map(([albumId, data]) => {
                        const album = ALBUM_DATABASE.find(a => a.id === parseInt(albumId));
                        const avgRating = getAlbumRating(currentUser.id, parseInt(albumId));
                        return { album, data, avgRating };
                    })
                    .filter(r => r.album && r.avgRating !== null)
                    .sort((a, b) => (b.data.timestamp || 0) - (a.data.timestamp || 0));

                return (
                    <div className="min-h-screen music-bg text-white pb-24">
                        {/* Header */}
                        <div className="p-4 sticky top-0 z-20" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)" }}>
                            <div className="flex items-center justify-between">
                                <h1 className="text-2xl font-bold">Profile</h1>
                                <button
                                    onClick={handleLogout}
                                    className="p-2 rounded-lg bg-red-500/20 text-red-400"
                                >
                                    <LogOut />
                                </button>
                            </div>
                        </div>

                        <div className="p-4 max-w-2xl mx-auto">
                            {/* User Info */}
                            <div className="flex items-center gap-4 mb-6">
                                <div className="w-20 h-20 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center text-3xl font-bold">
                                    {currentUser.displayName[0].toUpperCase()}
                                </div>
                                <div>
                                    <h2 className="text-2xl font-bold">{currentUser.displayName}</h2>
                                    <p className="text-gray-400">@{currentUser.username}</p>
                                </div>
                            </div>

                            {/* Stats */}
                            <div className="grid grid-cols-2 gap-4 mb-6">
                                <div className="card-gradient rounded-xl p-4 text-center border border-pink-500/20">
                                    <p className="text-3xl font-bold text-pink-400">{ratedAlbums.length}</p>
                                    <p className="text-gray-400 text-sm">Albums Rated</p>
                                </div>
                                <div className="card-gradient rounded-xl p-4 text-center border border-pink-500/20">
                                    <p className="text-3xl font-bold text-pink-400">{(friends[currentUser.id] || []).length}</p>
                                    <p className="text-gray-400 text-sm">Friends</p>
                                </div>
                            </div>

                            {/* Rated Albums */}
                            <h2 className="text-xl font-semibold mb-4">Your Ratings</h2>
                            {ratedAlbums.length === 0 ? (
                                <p className="text-gray-400 text-center py-8">No albums rated yet. Start rating!</p>
                            ) : (
                                <div className="space-y-3">
                                    {ratedAlbums.map(({ album, data, avgRating }) => (
                                        <div
                                            key={album.id}
                                            onClick={() => {
                                                setSelectedAlbum(album);
                                                setCurrentPage("album");
                                            }}
                                            className="card-gradient rounded-xl p-4 border border-pink-500/20 cursor-pointer hover:border-pink-500/50 transition-colors"
                                        >
                                            <div className="flex gap-4">
                                                <img
                                                    src={album.cover}
                                                    alt={album.name}
                                                    className="w-16 h-16 rounded-lg object-cover"
                                                    onError={(e) => { e.target.src = "https://via.placeholder.com/64?text=Album"; }}
                                                />
                                                <div className="flex-1">
                                                    <h3 className="font-semibold">{album.name}</h3>
                                                    <p className="text-pink-400 text-sm">{album.artist}</p>
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <RatingDisplay rating={avgRating} />
                                                        <span className="text-gray-400 text-sm">
                                                            ({Object.keys(data.songs || {}).length} songs)
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                            {data.albumComment && (
                                                <p className="mt-2 text-gray-300 text-sm">"{data.albumComment}"</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Bottom Nav */}
                        <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />
                    </div>
                );
            }

            // Home Page (Album List)
            return (
                <div className="min-h-screen music-bg text-white pb-24">
                    {/* Header */}
                    <div className="p-4 sticky top-0 z-20" style={{ background: "linear-gradient(135deg, #16213e 0%, #1a1a2e 100%)" }}>
                        <div className="flex items-center gap-3 mb-4">
                            <Music />
                            <h1 className="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                                RateMyMusic
                            </h1>
                        </div>

                        {/* Search */}
                        <div className="relative">
                            <div className="absolute left-4 top-1/2 transform -translate-y-1/2 text-pink-500">
                                <Search />
                            </div>
                            <input
                                type="text"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                placeholder="Search albums or artists..."
                                className="w-full pl-12 pr-4 py-3 rounded-xl bg-white/5 border border-pink-500/30 focus:outline-none focus:border-pink-500 text-white"
                            />
                        </div>
                    </div>

                    {/* Album Grid */}
                    <div className="p-4 max-w-2xl mx-auto">
                        <h2 className="text-xl font-semibold mb-4">Albums</h2>
                        <div className="grid grid-cols-2 gap-4">
                            {filteredAlbums.map(album => {
                                const userRating = getAlbumRating(currentUser.id, album.id);
                                return (
                                    <div
                                        key={album.id}
                                        onClick={() => {
                                            setSelectedAlbum(album);
                                            setCurrentPage("album");
                                        }}
                                        className="card-gradient rounded-xl overflow-hidden border border-pink-500/20 cursor-pointer hover:border-pink-500/50 transition-all hover:scale-105"
                                    >
                                        <img
                                            src={album.cover}
                                            alt={album.name}
                                            className="w-full aspect-square object-cover"
                                            onError={(e) => { e.target.src = "https://via.placeholder.com/200?text=Album"; }}
                                        />
                                        <div className="p-3">
                                            <h3 className="font-semibold text-sm truncate">{album.name}</h3>
                                            <p className="text-pink-400 text-xs truncate">{album.artist}</p>
                                            <p className="text-gray-400 text-xs">{album.year}</p>
                                            {userRating !== null && (
                                                <div className="mt-1">
                                                    <RatingDisplay rating={userRating} />
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {filteredAlbums.length === 0 && (
                            <p className="text-gray-400 text-center py-8">No albums found</p>
                        )}
                    </div>

                    {/* Bottom Nav */}
                    <BottomNav currentPage={currentPage} setCurrentPage={setCurrentPage} />
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MusicRatingApp />);
    </script>
</body>
</html>
